name: Feature request
description: 新機能や改善を起票する
labels: ['type: feature']
body:
  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      value: |
        ## 背景
        <!-- 解決したい課題 -->

        ## 提案
        <!-- どう変えたいか -->

        ## 完了条件
        - [ ]
        - [ ]
    validations:
      required: true
